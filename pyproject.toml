[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "optimus_dime"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "python-dotenv",
    "pyyaml",
    "ccxt>=4.5.93",
    "psycopg[binary]>=3.2",
    "sqlalchemy>=2.0",
]

[tool.setuptools.packages.find]
where = ["src"]